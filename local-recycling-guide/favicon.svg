<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon for Local Recycling Guide -->
  <!-- Dark green rounded surface badge matching the site's palette -->
  <rect width="64" height="64" rx="14" fill="#132A1B" stroke="#1F3D28" stroke-width="2"/>
  
  <!-- Recycling symbol in Primary Green (#4CAF50) and Light Green (#8BC34A) -->
  <g fill="#4CAF50">
    <!-- Top arrow loop -->
    <path d="M30.5 12h5v6h-5z"/>
    <path d="M28 15l4-7 4 7h-8z"/>
    <path d="M35 14h7c2.2 0 4 1.8 4 4v11h-4V18h-7v-4z"/>
    
    <!-- Right arrow loop -->
    <path d="M43 36.5l3.5-3.5 4.2 4.2-3.5 3.5z"/>
    <path d="M48.5 35l1.5 8-7-4.5 5.5-3.5z"/>
    <path d="M43.5 40.5l-3.5 6.1c-1.1 1.9-3.5 2.6-5.4 1.5l-9.5-5.5 2-3.5 9.5 5.5 3.5-6.1 3.4 2z"/>
    
    <!-- Left arrow loop -->
    <path d="M22.5 38.5l-1.5-4.8 5.7-1.8 1.5 4.8z"/>
    <path d="M22 32l-7.5 3 3.5 7.3 4-10.3z"/>
    <path d="M21 38.5v7c0 2.2-1.8 4-4 4H10v-4h7v-7h4z" fill="#8BC34A"/>
  </g>
